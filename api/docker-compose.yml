version: "3.9"

services:
  api:
    image: recipes-api
    environment:
      - MONGO_URI=mongodb://admin:password@mongodb:27017/admin?authSource=admin&readPreference=primary&ssl=false
      - MONGO_DATABASE=demo
      - REDIS_ADDRESS=redis:6379
      - JWT_SECRET=xentTmDleoJcl+ELkJzAzg==
    networks:
      - api_network
    external_links:
      - mongodb
      - redis
    scale: 3
  
  redis:
    image: redis:6.2-alpine
    ports:
      - "6379:6379"
    networks:
      - api_network
  
  mongodb:
    image: mongo:4.4.3
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
      - MONGO_INITDB_DATABASE=demo
    networks:
      - api_network

  nginx:
    image: nginx
    ports:
      - 80:80
    volumes:
      - $PWD/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - api
    networks:
      - api_network
    
networks:
  api_network:
    name: api_network